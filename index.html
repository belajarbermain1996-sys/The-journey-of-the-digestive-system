<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGESTIVE ADVENTURE — Petualangan Sistem Pencernaan Kelas V SD</title>
<meta name="description" content="Aplikasi web pembelajaran interaktif sistem pencernaan manusia untuk siswa kelas V SD mata pelajaran IPAS. Materi, anatomi interaktif, simulasi perjalanan makanan, game edukasi, chatbot Mr. Mouth, dan evaluasi.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#38bdf8; --sky2:#0ea5e9; --sky-d:#0369a1;
  --green:#22c55e; --green2:#16a34a; --green-d:#15803d;
  --orange:#f97316; --orange2:#fb923c; --orange-d:#c2410c;
  --yellow:#fbbf24; --yellow-d:#b45309;
  --pink:#f472b6; --red:#ef4444; --red-d:#b91c1c;
  --ink:#17335a; --muted:#5b7290; --card:#ffffff;
  --bg1:#bfe7ff; --bg2:#dff3ff;
  --radius:24px;
  --shadow:0 10px 30px rgba(14,110,180,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito','Segoe UI',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 500px at 110% -10%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(900px 420px at -15% 15%, rgba(255,255,255,.5), transparent 55%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, #eaf9ff 100%);
  min-height:100vh;
  font-size:16px; line-height:1.6;
}
h1,h2,h3,h4{font-family:'Baloo 2','Nunito',sans-serif; margin:0 0 .4rem; line-height:1.25;}
h1{font-size:2rem;} h2{font-size:1.5rem;} h3{font-size:1.2rem;}
p{margin:.5rem 0;}
a{color:var(--sky-d);}
img{max-width:100%;}
button{font-family:inherit;}
.hidden{display:none !important;}

/* ---------- clouds & blobs ---------- */
.cloud{position:fixed; z-index:0; opacity:.75; pointer-events:none; font-size:54px; animation:drift linear infinite;}
.cloud.c1{top:6%; left:-70px; animation-duration:60s;}
.cloud.c2{top:16%; left:30%; font-size:38px; animation-duration:85s; animation-delay:-30s;}
.cloud.c3{top:55%; left:60%; font-size:44px; animation-duration:95s; animation-delay:-50s; opacity:.5;}
@keyframes drift{from{transform:translateX(-15vw)} to{transform:translateX(115vw)}}

/* ---------- topbar ---------- */
#topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
  padding:.55rem 1rem; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
  border-bottom:3px solid rgba(56,189,248,.25);
  box-shadow:0 4px 18px rgba(14,110,180,.10);
}
.brand{display:flex; align-items:center; gap:.55rem; cursor:pointer; user-select:none;}
.brand .logo{
  width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,var(--orange),var(--yellow));
  box-shadow:0 4px 0 rgba(194,65,12,.35); animation:floaty 3.5s ease-in-out infinite;
}
.brand b{font-family:'Baloo 2'; font-size:1.12rem; letter-spacing:.5px; color:var(--ink); display:block; line-height:1.1;}
.brand small{display:block; color:var(--muted); font-size:.68rem; font-weight:700; letter-spacing:1.5px;}
#nav{display:flex; gap:.35rem; flex-wrap:nowrap; overflow-x:auto; flex:1; padding:.2rem; scrollbar-width:none;}
#nav::-webkit-scrollbar{display:none;}
.nav-chip{
  border:2px solid transparent; background:#f1f8ff; color:var(--ink);
  padding:.42rem .8rem; border-radius:999px; font-weight:800; font-size:.86rem;
  cursor:pointer; white-space:nowrap; transition:.15s;
}
.nav-chip:hover{background:#e0f2fe; transform:translateY(-1px);}
.nav-chip.active{background:linear-gradient(135deg,var(--sky2),var(--sky)); color:#fff; border-color:#bae6fd; box-shadow:0 3px 0 rgba(3,105,161,.35);}
.userbox{display:flex; align-items:center; gap:.5rem;}
.rolebadge{font-size:.66rem; font-weight:900; padding:.2rem .55rem; border-radius:999px; letter-spacing:.5px;}
.role-siswa{background:#dcfce7; color:var(--green-d);}
.role-guru{background:#e0e7ff; color:#4338ca;}
.role-admin{background:#fee2e2; color:var(--red-d);}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#fde68a,#fbbf24); border:2px solid #fff; box-shadow:0 2px 8px rgba(180,83,9,.3);}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  border:none; cursor:pointer; font-weight:900; color:#fff;
  padding:.68rem 1.35rem; border-radius:999px; font-size:.95rem;
  transition:transform .12s, box-shadow .12s, filter .15s;
  text-decoration:none; user-select:none;
}
.btn:hover{filter:brightness(1.06); transform:translateY(-1px);}
.btn:active{transform:translateY(3px);}
.btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange2)); box-shadow:0 4px 0 var(--orange-d);}
.btn-green{background:linear-gradient(135deg,var(--green2),var(--green)); box-shadow:0 4px 0 var(--green-d);}
.btn-sky{background:linear-gradient(135deg,var(--sky2),var(--sky)); box-shadow:0 4px 0 var(--sky-d);}
.btn-red{background:linear-gradient(135deg,#ef4444,#f87171); box-shadow:0 4px 0 var(--red-d);}
.btn-ghost{background:#fff; color:var(--sky-d); border:2.5px solid #bae6fd; box-shadow:0 3px 0 #bae6fd;}
.btn-yellow{background:linear-gradient(135deg,#f59e0b,var(--yellow)); box-shadow:0 4px 0 var(--yellow-d); color:#5b3600;}
.btn-sm{padding:.4rem .85rem; font-size:.8rem; border-radius:999px;}
.btn-lg{padding:.85rem 1.8rem; font-size:1.05rem;}
.btn:disabled{opacity:.55; cursor:not-allowed; transform:none;}
.btn-block{width:100%;}

/* ---------- layout ---------- */
#app{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:1.2rem 1rem 4rem;}
.page-head{display:flex; align-items:center; gap:.8rem; margin:.8rem 0 1rem; flex-wrap:wrap;}
.page-head h1{margin:0;}
.page-head .sub{color:var(--muted); font-weight:700; font-size:.92rem; width:100%;}
.grid{display:grid; gap:1rem;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.grid-menu{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));}
.card{
  background:var(--card); border-radius:var(--radius); padding:1.15rem 1.25rem;
  box-shadow:var(--shadow); border:2.5px solid #eaf6ff;
  animation:pop .35s ease both;
}
.card.hover:hover{transform:translateY(-4px); border-color:#bae6fd; transition:.18s;}
.card .card-title{display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem;}
.menu-tile{
  background:var(--card); border-radius:var(--radius); padding:1.1rem; text-align:center;
  box-shadow:var(--shadow); border:2.5px solid #eaf6ff; cursor:pointer; position:relative; overflow:hidden;
  transition:.18s; animation:pop .4s ease both;
}
.menu-tile:hover{transform:translateY(-6px) scale(1.02); border-color:var(--sky);}
.menu-tile .icon{font-size:2.6rem; line-height:1; margin-bottom:.4rem; display:inline-block; animation:floaty 3s ease-in-out infinite;}
.menu-tile b{font-family:'Baloo 2'; font-size:1.02rem; display:block;}
.menu-tile small{color:var(--muted); font-weight:700; font-size:.78rem; display:block; margin-top:.15rem;}
.menu-tile .tint{position:absolute; inset:auto -30% -60% auto; width:130px; height:130px; border-radius:50%; opacity:.12;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pop{from{opacity:0; transform:scale(.94) translateY(10px)} to{opacity:1; transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes slideup{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
.fade-in{animation:slideup .3s ease both;}

/* ---------- badges, chips, misc ---------- */
.chip{display:inline-flex; align-items:center; gap:.3rem; background:#f1f8ff; border:2px solid #dbeeff; color:var(--sky-d); padding:.22rem .7rem; border-radius:999px; font-weight:800; font-size:.78rem;}
.chip.orange{background:#fff4e5; border-color:#ffe0b8; color:var(--orange-d);}
.chip.green{background:#eafbef; border-color:#bff0d6; color:var(--green-d);}
.chip.yellow{background:#fff8dd; border-color:#ffeeb0; color:#92400e;}
.chip.red{background:#ffecec; border-color:#ffd0d0; color:var(--red-d);}
.enzyme-badge{display:inline-flex; align-items:center; gap:.25rem; background:linear-gradient(135deg,#f0f9ff,#e0f2fe); border:2px solid #bae6fd; color:var(--sky-d); padding:.25rem .7rem; border-radius:999px; font-weight:800; font-size:.8rem; margin:.15rem .2rem;}
.factbox{background:linear-gradient(135deg,#fff8dd,#fff3c4); border:2.5px dashed #fbbf24; border-radius:18px; padding:.8rem 1rem; margin:.7rem 0; font-weight:700;}
.factbox .fact-title{color:var(--yellow-d); font-weight:900; font-family:'Baloo 2';}
.tipbox{background:linear-gradient(135deg,#eafbef,#dcfce7); border:2.5px dashed var(--green); border-radius:18px; padding:.8rem 1rem; margin:.7rem 0; font-weight:700;}
.warnbox{background:linear-gradient(135deg,#fff1f0,#ffe4e4); border:2.5px dashed var(--red); border-radius:18px; padding:.8rem 1rem; margin:.7rem 0; font-weight:700;}
.progressbar{height:14px; background:#e6f2fb; border-radius:999px; overflow:hidden; border:2px solid #d8ecfa;}
.progressbar > div{height:100%; background:linear-gradient(90deg,var(--green2),var(--green)); border-radius:999px; transition:width .5s ease;}
.progressbar.sky > div{background:linear-gradient(90deg,var(--sky2),#38bdf8);}
.progressbar.orange > div{background:linear-gradient(90deg,var(--orange-d),var(--orange));}
.star{font-size:1.4rem; filter:grayscale(1) opacity(.35);}
.star.on{filter:none; animation:pop .4s ease both;}

/* ---------- forms ---------- */
.input, select.input, textarea.input{
  width:100%; padding:.72rem 1rem; border-radius:16px; border:2.5px solid #d8ecfa;
  background:#f8fcff; font-family:inherit; font-weight:700; color:var(--ink); font-size:.95rem;
  outline:none; transition:.15s;
}
.input:focus{border-color:var(--sky); background:#fff; box-shadow:0 0 0 4px rgba(56,189,248,.15);}
label.lb{display:block; font-weight:800; font-size:.82rem; color:var(--muted); margin:.65rem 0 .3rem; letter-spacing:.3px;}
.field-hint{font-size:.75rem; color:var(--muted); font-weight:700; margin-top:.25rem;}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto; border-radius:18px; border:2.5px solid #e3f2fd; background:#fff;}
table.tbl{width:100%; border-collapse:collapse; font-size:.88rem; min-width:640px;}
.tbl th{background:linear-gradient(135deg,var(--sky2),var(--sky)); color:#fff; padding:.7rem .8rem; text-align:left; font-family:'Baloo 2'; font-size:.85rem; letter-spacing:.3px;}
.tbl td{padding:.62rem .8rem; border-top:2px solid #eef7ff; font-weight:700;}
.tbl tr:nth-child(even) td{background:#f7fbff;}
.tbl tr.clickable{cursor:pointer;}
.tbl tr.clickable:hover td{background:#e9f6ff;}

/* ---------- quiz / game ---------- */
.opt{
  display:flex; align-items:center; gap:.7rem; width:100%; text-align:left;
  background:#f8fcff; border:2.5px solid #d8ecfa; border-radius:18px;
  padding:.75rem 1rem; font-weight:800; font-size:.95rem; cursor:pointer; transition:.15s; margin:.45rem 0;
}
.opt:hover{border-color:var(--sky); transform:translateX(4px); background:#fff;}
.opt.sel-wrong{border-color:var(--red); background:#ffecec;}
.opt.sel-right{border-color:var(--green); background:#eafbef;}
.opt:disabled{cursor:default;}
.opt .letter{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky2),var(--sky));color:#fff;font-weight:900;flex-shrink:0;}
.opt.sel-wrong .letter{background:linear-gradient(135deg,#ef4444,#f87171);}
.opt.sel-right .letter{background:linear-gradient(135deg,var(--green2),var(--green));}
.hintbox{background:linear-gradient(135deg,#f0f9ff,#e0f2fe); border-left:6px solid var(--sky); border-radius:14px; padding:.7rem 1rem; margin:.6rem 0; animation:slideup .3s ease both;}
.hintbox.l2{border-color:var(--yellow); background:linear-gradient(135deg,#fffbeb,#fef3c7);}
.hintbox.l3{border-color:var(--green); background:linear-gradient(135deg,#f0fdf4,#dcfce7);}
.scaffold-meter{display:flex; align-items:center; gap:.4rem; background:#fff; border:2px solid #e3f2fd; border-radius:999px; padding:.3rem .8rem; font-weight:800; font-size:.78rem; color:var(--muted);}
.lvl-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem;}
.lvl-card{position:relative; border-radius:var(--radius); padding:1.1rem; color:#fff; box-shadow:var(--shadow); overflow:hidden; cursor:pointer; transition:.18s; border:3px solid rgba(255,255,255,.5);}
.lvl-card:hover{transform:translateY(-5px) scale(1.02);}
.lvl-card.locked{filter:grayscale(.9) opacity(.75); cursor:not-allowed;}
.lvl-card .num{position:absolute; right:-14px; top:-18px; font-size:5.5rem; font-family:'Baloo 2'; opacity:.25; font-weight:800;}
.lvl-1{background:linear-gradient(135deg,#0ea5e9,#38bdf8);}
.lvl-2{background:linear-gradient(135deg,#16a34a,#4ade80);}
.lvl-3{background:linear-gradient(135deg,#ea580c,#fb923c);}
.lvl-4{background:linear-gradient(135deg,#7c3aed,#a78bfa);}
.seq-slot{min-height:52px; border:2.5px dashed #bae6fd; border-radius:16px; background:#f5fbff; display:flex; flex-wrap:wrap; gap:.4rem; padding:.5rem; align-items:center;}
.seq-chip{display:inline-flex; align-items:center; gap:.4rem; background:linear-gradient(135deg,var(--orange),var(--orange2)); color:#fff; font-weight:900; padding:.45rem .9rem; border-radius:999px; font-size:.85rem; animation:pop .25s ease both; box-shadow:0 3px 0 var(--orange-d);}
.pool-chip{display:inline-flex; align-items:center; gap:.4rem; background:#fff; border:2.5px solid #d8ecfa; color:var(--ink); font-weight:900; padding:.5rem 1rem; border-radius:999px; font-size:.88rem; cursor:pointer; margin:.3rem; transition:.15s; box-shadow:0 3px 0 #d8ecfa;}
.pool-chip:hover{transform:translateY(-2px); border-color:var(--sky);}
.pool-chip:disabled{opacity:.35; cursor:not-allowed; transform:none;}
.cat-btn{flex:1; padding:1rem; border-radius:20px; border:none; cursor:pointer; font-family:'Baloo 2'; font-size:1.05rem; color:#fff; font-weight:800; transition:.15s;}
.cat-btn.m{background:linear-gradient(135deg,#0ea5e9,#38bdf8); box-shadow:0 4px 0 var(--sky-d);}
.cat-btn.k{background:linear-gradient(135deg,#ea580c,#fb923c); box-shadow:0 4px 0 var(--orange-d);}
.cat-btn:hover{filter:brightness(1.08); transform:translateY(-2px);}

/* ---------- simulator ---------- */
.journey-track{position:relative; display:flex; flex-direction:column; gap:.35rem; padding:.4rem 0;}
.station{display:flex; align-items:center; gap:.8rem; padding:.55rem .8rem; border-radius:18px; border:2.5px solid transparent; transition:.25s; position:relative;}
.station .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#eaf6ff;border:3px solid #cfe9ff; flex-shrink:0; z-index:1; transition:.25s;}
.station .sline{position:absolute; left:calc(.8rem + 23px); top:52px; bottom:-8px; width:5px; background:#cfe9ff; border-radius:99px; z-index:0;}
.station:last-child .sline{display:none;}
.station.active{background:#fff; border-color:var(--orange); box-shadow:var(--shadow); transform:scale(1.03);}
.station.active .dot{background:linear-gradient(135deg,var(--orange),var(--yellow)); border-color:#fff; animation:bounce 1s ease-in-out infinite;}
.station.done .dot{background:#eafbef; border-color:var(--green);}
.station .sname{font-weight:900; font-family:'Baloo 2';}
.station small{display:block; color:var(--muted); font-weight:700; font-size:.75rem;}
.food-chip{display:flex; flex-direction:column; align-items:center; gap:.3rem; background:#fff; border:2.5px solid #e3f2fd; border-radius:20px; padding:.9rem .5rem; cursor:pointer; transition:.15s; min-width:100px;}
.food-chip:hover{transform:translateY(-4px); border-color:var(--sky);}
.food-chip.sel{border-color:var(--orange); background:#fff7ed; box-shadow:0 4px 0 var(--orange-d);}
.food-chip .fe{font-size:2.2rem;}
.food-chip b{font-family:'Baloo 2'; font-size:.88rem;}
.food-chip small{font-size:.68rem; color:var(--muted); font-weight:800;}
.journey-food{font-size:2.4rem; display:inline-block; filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));}

/* ---------- chat ---------- */
.chatwrap{display:flex; flex-direction:column; height:min(62vh,560px); background:#f4faff; border-radius:20px; border:2.5px solid #e3f2fd; overflow:hidden;}
.chatlog{flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.65rem;}
.msg{max-width:82%; padding:.6rem .95rem; border-radius:18px; font-weight:700; font-size:.92rem; animation:slideup .25s ease both; white-space:pre-wrap; word-wrap:break-word;}
.msg.bot{background:#fff; border:2px solid #e3f2fd; border-bottom-left-radius:6px; align-self:flex-start;}
.msg.user{background:linear-gradient(135deg,var(--sky2),var(--sky)); color:#fff; border-bottom-right-radius:6px; align-self:flex-end;}
.msg .who{font-size:.66rem; font-weight:900; color:var(--muted); letter-spacing:.5px; margin-bottom:.15rem; display:block;}
.msg.user .who{color:#dbf3ff;}
.typing{display:inline-flex; gap:5px; padding:.4rem 0;}
.typing i{width:8px;height:8px;border-radius:50%;background:#94c8e8; animation:blink 1s infinite;}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25; transform:translateY(0)}50%{opacity:1; transform:translateY(-4px)}}
.chatin{display:flex; gap:.5rem; padding:.7rem; background:#fff; border-top:2.5px solid #e3f2fd;}
.chatin input{flex:1;}
.quickchips{display:flex; gap:.4rem; flex-wrap:wrap; padding:.5rem .7rem .2rem; background:#fff;}
.quickchip{background:#f1f8ff; border:2px solid #dbeeff; color:var(--sky-d); border-radius:999px; padding:.3rem .8rem; font-weight:800; font-size:.76rem; cursor:pointer;}
.quickchip:hover{background:#e0f2fe;}

/* ---------- modal & toast ---------- */
#modal{position:fixed; inset:0; z-index:90; background:rgba(10,50,90,.45); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:1rem;}
#modal.open{display:flex;}
.modal-box{background:#fff; border-radius:26px; max-width:720px; width:100%; max-height:88vh; overflow-y:auto; padding:1.4rem; animation:pop .3s ease both; box-shadow:0 24px 60px rgba(0,0,0,.25); border:3px solid #e3f2fd;}
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:.5rem; align-items:center;}
.toastitem{background:#17335a; color:#fff; font-weight:800; padding:.6rem 1.2rem; border-radius:999px; box-shadow:0 8px 22px rgba(0,0,0,.25); animation:slideup .3s ease both; font-size:.88rem;}
.toastitem.green{background:var(--green2);} .toastitem.red{background:var(--red-d);} .toastitem.orange{background:var(--orange-d);}

/* ---------- login ---------- */
.login-hero{position:relative; overflow:hidden; background:linear-gradient(135deg,#0ea5e9 0%, #38bdf8 55%, #7dd3fc 100%); border-radius:32px; color:#fff; box-shadow:var(--shadow); border:3px solid rgba(255,255,255,.55);}
.login-hero .inner{position:relative; z-index:2; padding:2rem 1.6rem;}
.bubble{position:absolute; border-radius:50%; background:rgba(255,255,255,.22); animation:floaty 5s ease-in-out infinite;}
.tabbtns{display:flex; background:#eef6ff; border-radius:999px; padding:.3rem; gap:.3rem;}
.tabbtns button{flex:1; border:none; background:transparent; padding:.6rem; border-radius:999px; font-weight:900; cursor:pointer; color:var(--muted); font-size:.92rem; transition:.15s;}
.tabbtns button.active{background:#fff; color:var(--sky-d); box-shadow:0 3px 8px rgba(14,110,180,.15);}

/* ---------- anatomi ---------- */
.bodysvg .organ{cursor:pointer; transition:.15s;}
.bodysvg .organ:hover{filter:brightness(1.12) drop-shadow(0 0 5px rgba(251,191,36,.9));}
.bodysvg .organ.active{filter:drop-shadow(0 0 8px rgba(251,191,36,1));}
.bodysvg .organ-badge{cursor:pointer;}
.bodysvg .organ-badge circle{transition:.15s;}
.bodysvg .organ-badge:hover circle{fill:#fbbf24;}
.bodysvg .organ-badge.active circle{fill:#f97316; stroke:#fff; stroke-width:3;}
.organ-list-item{display:flex; align-items:center; gap:.6rem; padding:.5rem .7rem; border-radius:14px; cursor:pointer; border:2.5px solid transparent; font-weight:800; transition:.12s;}
.organ-list-item:hover{background:#f1f8ff;}
.organ-list-item.active{background:#fff7ed; border-color:var(--orange);}
.organ-list-item .onum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sky2); color:#fff; font-size:.72rem; font-weight:900; flex-shrink:0;}

/* ---------- peta anatomi berbasis gambar ---------- */
.anatmap{position:relative; max-width:520px; margin:auto;}

.hspot{position:absolute; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%;
  border:3px solid #fff; background:linear-gradient(135deg,var(--sky2),var(--sky)); cursor:pointer; padding:0;
  display:grid; place-items:center; box-shadow:0 3px 8px rgba(3,60,100,.45); transition:transform .15s; z-index:2;}
.hspot .hnum{color:#fff; font-weight:900; font-size:.8rem; font-family:'Baloo 2'; line-height:1; pointer-events:none;}
.hspot:hover{transform:translate(-50%,-50%) scale(1.28); z-index:5;}
.hspot.active{background:linear-gradient(135deg,var(--orange),var(--yellow)); animation:hspotPulse 1.5s ease-in-out infinite; z-index:4;}
.hspot.active .hnum{color:#7c2d12;}
.hspot .hlabel{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.96);
  border:2px solid #bae6fd; color:var(--ink); font-weight:800; font-size:.66rem; padding:.18rem .55rem;
  border-radius:999px; white-space:nowrap; pointer-events:none; box-shadow:0 2px 8px rgba(3,60,100,.22);}
.hspot .hlabel.right{left:26px;}
.hspot .hlabel.left{right:26px;}
@keyframes hspotPulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}50%{box-shadow:0 0 0 14px rgba(249,115,22,0)}}
.anatmap-sim{max-width:400px;}
@media (max-width:560px){ .hspot .hlabel{display:none;} }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- async SHA-256 password hashing ---------- */
async function hashPass(pw) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('da-salt::' + pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; const s = 'da-salt::' + pw;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return 'f' + h.toString(16);
  }
}

function checkAllBadges() {

/* ---------- auth ---------- */
async function doRegister(data) {
  const email = (data.email || '').trim().toLowerCase();
  const username = (data.username || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok: false, msg: 'Alamat email tidak valid, ya. Contoh: ortu@gmail.com' };
  if (!/^[a-zA-Z0-9_.]{3,20}$/.test(username)) return { ok: false, msg: 'Username 3–20 karakter, hanya huruf, angka, titik, atau garis bawah.' };
  if ((data.password || '').length < 4) return { ok: false, msg: 'Kata sandi minimal 4 karakter ya.' };
  if (data.password !== data.confirm) return { ok: false, msg: 'Konfirmasi kata sandi belum sama.' };
  if (USERS.some(u => u.username.toLowerCase() === username.toLowerCase())) return { ok: false, msg: 'Username "' + username + '" sudah dipakai. Pilih yang lain.' };
  let role = 'siswa';
  if (data.role === 'guru') {
    if ((data.guruCode || '').trim().toUpperCase() !== CONTENT.settings.guruCode) return { ok: false, msg: 'Kode Guru salah. Minta kode khusus pada guru/Ibu Bapak Pemangku.' };
    role = 'guru';
  }
  const u = { id: uid(), email, username, pass: await hashPass(data.password), role, created: nowISO(), lastActive: nowISO(), progress: freshProgress() };
  USERS.push(u); saveUsers();
  return { ok: true, user: u };
}
async function doLogin(username, password) {
  const uname = (username || '').trim().toLowerCase();
  const u = USERS.find(x => x.username.toLowerCase() === uname);
  if (!u) return { ok: false, msg: 'Username belum terdaftar. Yuk daftar dulu di tab "Daftar"!' };
  const h = await hashPass(password || '');
  if (h !== u.pass) return { ok: false, msg: 'Kata sandi salah. Coba ingat lagi ya 💪' };
  return { ok: true, user: u };
}

/* ============================================================
   ADAPTIVE SCAFFOLDING ENGINE
   ============================================================ */
function scaffoldInfo() {
  const w = cur() ? cur().progress.scaffold.wrong : 0;
  if (w >= 3) return { lvl: 3, name: 'Penjelasan Penuh', icon: '🤝', desc: 'Sistem menemanimu dengan penjelasan lengkap. Pelan-pelan, kamu pasti bisa!' };
  if (w === 2) return { lvl: 2, name: 'Bimbingan Konsep', icon: '🧭', desc: 'Sistem memberimu bimbingan konsep lebih dalam.' };
  if (w === 1) return { lvl: 1, name: 'Petunjuk Ringan', icon: '💡', desc: 'Sistem memberimu petunjuk ringan.' };
  return { lvl: 0, name: 'Mandiri', icon: '🚀', desc: 'Kamu sedang fokus mandiri. Pertahankan!' };
}
function scaffoldMeterHTML() {
  const s = scaffoldInfo();
  return `<span class="scaffold-meter" title="${esc(s.desc)}">${s.icon} Bantuan: <b>${s.name}</b></span>`;
}
function recordAnswer(correct) {
  const u = cur(); if (!u) return;
  const s = u.progress.scaffold;
  if (correct) { s.mastery = (s.mastery || 0) + 1; s.wrong = Math.max(0, s.wrong - 1); }
  else { s.mastery = 0; s.wrong = Math.min(3, s.wrong + 1); }
  saveUsers();
}
/* hint HTML sesuai level scaffolding: q = {hint1, hint2, explain} */
function scaffoldHintHTML(q, level, showFull) {
  let out = '';
  if (level >= 1 || showFull >= 1) out += `<div class="hintbox">💡 <b>Petunjuk ringan:</b> ${esc(q.hint1 || 'Coba baca ulang pertanyaan dengan teliti ya.')}</div>`;
  if (level >= 2 || showFull >= 2) out += `<div class="hintbox l2">🧭 <b>Bimbingan konsep:</b> ${esc(q.hint2 || '')}</div>`;
  if (level >= 3 || showFull >= 3) out += `<div class="hintbox l3">🤝 <b>Penjelasan interaktif:</b> ${esc(q.explain || '')}</div>`;
  return out;
}

/* ============================================================
   QUIZ MACHINE (dipakai kuis organ & modul)
   state: S.quiz = {qs, idx, wrongCount, score, correctCount, answered, done, source}
   ============================================================ */
function startQuiz(qs, source) {
  S.quiz = { qs, idx: 0, wrongCount: 0, score: 0, correctCount: 0, done: false, source };
}
function quizTotal() { return S.quiz ? S.quiz.qs.length : 0; }
function quizRenderHTML() {
  const qz = S.quiz; if (!qz) return '';
  const q = qz.qs[qz.idx];
  const meta = { organ: 'Kuis Organ', modul: 'Kuis Pemahaman' }[qz.source] || (S.game ? 'Level ' + S.game.level + ' • ' + (LEVEL_META[S.game.level - 1] || {}).nama : 'Kuis');
  if (qz.done) {
    const perfect = qz.correctCount === quizTotal();
    return `<div class="card center fade-in">
      <div class="big-emoji">${perfect ? '🏆' : '🎉'}</div>
      <h2>${perfect ? 'Sempurna! Kamu luar biasa!' : 'Kuis selesai, kerja bagus!'}</h2>
      <p>Benar <b>${qz.correctCount}</b> dari <b>${quizTotal()}</b> soal • Skor <b>${qz.score}</b> poin</p>
      <div class="mb1">${scaffoldMeterHTML()}</div>
      <button class="btn btn-green" onclick="App.closeQuiz()">Lanjut Yuk!</button></div>`;
  }
  const opts = q._shuf || (q._shuf = shuffle(q.opts.map((t, i) => ({ t, i }))));
  return `<div class="card fade-in" id="quizbox">
    <div class="row spread mb1">
      <span class="chip">${meta} • Soal ${qz.idx + 1}/${quizTotal()}</span>
      <span class="chip green">⭐ ${qz.score} poin</span>
    </div>
    ${scaffoldMeterHTML()}
    <h3 class="mt1">${esc(q.q)}</h3>
    <div id="optwrap">${opts.map((o, k) => `
      <button class="opt" id="opt-${k}" onclick="App.quizPick(${k})"><span class="letter">${LETTERS[k]}</span>${esc(o.t)}</button>`).join('')}
    </div>
    <div id="hintarea">${qz.wrongCount > 0 ? scaffoldHintHTML(q, scaffoldInfo().lvl, 0) : ''}</div>
    <div id="quiznext"></div>
  </div>`;
}
function quizPick(k) {
  const qz = S.quiz; const q = qz.qs[qz.idx];
  const opts = q._shuf; const chosen = opts[k];
  if ($(`#opt-${k}`).classList.contains('sel-right') || qz._resolved) return;
  if (chosen.i === q.a) {
    const pts = qz.wrongCount === 0 ? 10 : 5;
    qz.score += pts; qz.correctCount++;
    if (qz.source === 'organ') { cur().progress.organCorrect++; }
    addPoints(pts); recordAnswer(true); touchUser();
    $(`#opt-${k}`).classList.add('sel-right');
    $$('#optwrap .opt').forEach(b => b.disabled = true);
    $('#hintarea').innerHTML = `<div class="hintbox l3">✅ <b>${pick(['Hebat!','Mantap!','Pintar sekali!','Keren!'])}</b> ${esc(q.explain || '')}</div>`;
    $('#quiznext').innerHTML = `<div class="center mt1"><button class="btn btn-primary" onclick="App.quizNext()">Lanjut Soal →</button></div>`;
    qz._resolved = true;
    checkAllBadges();
  } else {
    $(`#opt-${k}`).classList.add('sel-wrong'); $(`#opt-${k}`).disabled = true;
    qz.wrongCount++; recordAnswer(false); touchUser();
    if (qz.source === 'organ') cur().progress.organWrong++;
    const lvl = scaffoldInfo().lvl;
    $('#hintarea').innerHTML = `<div class="hintbox" style="border-color:var(--red);background:#fff5f5">😅 ${esc(pick(['Belum tepat, tapi tidak apa-apa!','Sedikit lagi, kamu pasti bisa!','Coba pikir lagi ya!']))}</div>` + scaffoldHintHTML(q, lvl, 0);
    toast(pick(DEFAULT_GAME.motivasi).replace(' 🌟','').replace(' 💪',''), '');
    $('#quiznext').innerHTML = lvl >= 3 ? `<div class="center mt1"><button class="btn btn-yellow" onclick="App.quizRetry()">🔄 Coba Pertanyaan Ini Lagi (dengan penjelasan)</button></div>` : '';
  }
  saveUsers();
}
function quizRetry() {
  const qz = S.quiz; const q = qz.qs[qz.idx];
  q._shuf = null; qz.wrongCount = 0; qz._resolved = false;
  if (S.quizModal) { quizModalOpen(); return; }
  render();
}
function quizNext() {
  const qz = S.quiz; qz._resolved = false;
  qz.qs[qz.idx]._shuf = null;
  qz.idx++;
  if (qz.idx >= quizTotal()) {
    qz.done = true;
    if (qz.source === 'modul' && S.param) markModuleQuiz(S.param, qz);
    if (qz.source === 'game' && S.game) { finalizeGameLevel(S.game.level, qz.score); return; }
  }
  if (S.quizModal) { quizModalOpen(); return; }
  render();
  window.scrollTo(0, document.body.scrollHeight / 2 - 200);
}
function quizModalOpen() {
  openModal('<div class="row spread mb1"><b>🧠 Kuis Organ</b><button class="btn btn-ghost btn-sm" onclick="App.closeQuiz()">✕ Tutup</button></div>' + quizRenderHTML());
}
function closeQuiz() { S.quiz = null; render(); }
function markModuleQuiz(mid, qz) {
  const u = cur(); const m = u.progress.modules[mid] || { read: false, quizDone: false, bestScore: 0 };
  m.quizDone = true; m.bestScore = Math.max(m.bestScore || 0, qz.score); m.last = nowISO();
  u.progress.modules[mid] = m;
  if (Object.keys(u.progress.modules).filter(k => u.progress.modules[k].done).length >= 6) awardBadge('baca');
  touchUser();
}

/* ============================================================
   CSV (Laporan Asesmen Guru) — delimiter ; + BOM untuk Excel ID
   ============================================================ */
function buildReportCSV() {
  const students = USERS.filter(u => u.role === 'siswa');
  const head = ['No','Username','Email Keluarga','Modul Materi Dibaca (n/6)','Kuis Organ Benar','Skor Game L1','Skor Game L2','Skor Game L3','Skor Game L4','Total Skor Game','Total Bintang','Simulasi Selesai (n/6)','Mode Bantuan Scaffolding','Poin Total','Status Evaluasi','Terakhir Aktif'];
  const rows = students.map((u, i) => {
    const p = u.progress;
    const readCount = Object.keys(p.modules).filter(k => p.modules[k] && p.modules[k].done).length;
    const totalGame = ['l1','l2','l3','l4'].reduce((s, k) => s + (p.game[k] ? p.game[k].best : 0), 0);
    const stars = ['l1','l2','l3','l4'].reduce((s, k) => s + (p.game[k] ? p.game[k].stars : 0), 0);
    return [i + 1, u.username, u.email, readCount + '/6', p.organCorrect || 0, p.game.l1.best, p.game.l2.best, p.game.l3.best, p.game.l4.best, totalGame, stars, p.simFoods.length + '/6', scaffoldInfoFor(u).name, p.points, p.evalDone ? 'Selesai' : 'Belum', fmtDate(u.lastActive)];
  });
  const escCell = v => { v = String(v); return (v.includes(';') || v.includes('"') || v.includes('\n')) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '\uFEFF' + [head, ...rows].map(r => r.map(escCell).join(';')).join('\n');
}
function scaffoldInfoFor(u) {
  const w = u.progress.scaffold.wrong || 0;
  if (w >= 3) return { lvl: 3, name: 'Penjelasan Penuh' };
  if (w === 2) return { lvl: 2, name: 'Bimbingan Konsep' };
  if (w === 1) return { lvl: 1, name: 'Petunjuk Ringan' };
  return { lvl: 0, name: 'Mandiri' };
}
function downloadCSV() {
  const blob = new Blob([buildReportCSV()], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Laporan_Asesmen_DigestiveAdventure_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('📥 Laporan asesmen berhasil diunduh!', 'green');
}

/* ---------- DASHBOARD ---------- */
VIEWS.dashboard = function () {
  const u = cur();
  if (u.role !== 'siswa') return dashboardGuruAdmin(u);
  const p = u.progress;
  const readCount = Object.keys(p.modules).filter(k => p.modules[k].done).length;
  const stars = ['l1','l2','l3','l4'].reduce((s, k) => s + p.game[k].stars, 0);
  const sf = scaffoldInfo();
  const hour = new Date().getHours();
  const greet = hour < 11 ? 'Selamat pagi' : hour < 15 ? 'Selamat siang' : hour < 18 ? 'Selamat sore' : 'Selamat malam';
  return `
  <div class="card fade-in" style="background:linear-gradient(135deg,#fff, #fff7ed); border-color:#fed7aa">
    <div class="row spread">
      <div>
        <h1>${greet}, ${esc(u.username)}! 🧒</h1>
        <p class="muted" style="font-weight:700">Siap melanjutkan petualangan sistem pencernaan hari ini?</p>
        <div class="row mt1">
          <span class="chip orange">⭐ ${p.points} Poin</span>
          <span class="chip green">📚 Materi ${readCount}/6</span>
          <span class="chip yellow">🌟 ${stars} Bintang Game</span>
          <span class="chip">🤝 ${sf.icon} Bantuan: ${sf.name}</span>
        </div>
        <div class="mt2" style="max-width:420px">
          <div class="row spread small" style="font-weight:800"><span>Progres Modul Materi</span><span>${Math.round(readCount / 6 * 100)}%</span></div>
          <div class="progressbar mt1"><div style="width:${readCount / 6 * 100}%"></div></div>
        </div>
      </div>
      <div class="big-emoji" style="font-size:4.4rem;animation:bounce 2.4s ease-in-out infinite">🦷🍚🌀</div>
    </div>
  </div>
  <h2 class="mt2 mb1">🗺️ Pilih Petualanganmu</h2>
  <div class="grid grid-menu">
    ${menuTile('materi','📚','Belajar Materi','6 modul seru + kuis','#0ea5e9')}
    ${menuTile('anatomi','🧍','Anatomi Interaktif','Klik organ, kenali fungsi','#f97316')}
    ${menuTile('video','🎬','Video Belajar','Tonton & pahami','#ef4444')}
    ${menuTile('simulasi','🍽️','Food Journey Simulator','Ikuti perjalanan makanan!','#22c55e')}
    ${menuTile('game','🎮','Game Petualangan','4 level seru + bintang','#a855f7')}
    ${menuTile('mouth','🤖','Tanya Mr. Mouth','Asisten AI ramah anak','#f59e0b')}
    ${menuTile('evaluasi','📝','Evaluasi Akhir','Google Form','#0ea5e9')}
    ${menuTile('progres','🏆','Progresku','Poin, badge & bintang','#fbbf24')}
  </div>
  <h2 class="mt2 mb1">🏅 Koleksi Badge</h2>
  <div class="grid grid-3">${BADGES.map(b => `
    <div class="card" style="${p.badges.includes(b.id) ? '' : 'opacity:.55'}">
      <div class="row"><span style="font-size:1.9rem">${b.icon}</span>
      <div><b>${b.nama}</b><div class="small muted">${b.ket}</div></div></div>
      ${p.badges.includes(b.id) ? '<span class="chip green mt1">✅ Diraih!</span>' : '<span class="chip mt1">🔒 Belum diraih</span>'}
    </div>`).join('')}
  </div>`;
};
function menuTile(screen, icon, title, sub, tint) {
  return `<div class="menu-tile" onclick="App.go('${screen}')"><div class="tint" style="background:${tint}"></div>
    <span class="icon">${icon}</span><b>${title}</b><small>${sub}</small></div>`;
}
function dashboardGuruAdmin(u) {
  const students = USERS.filter(x => x.role === 'siswa');
  const evalDone = students.filter(x => x.progress.evalDone).length;
  const avgGame = students.length ? Math.round(students.reduce((s, x) => s + ['l1','l2','l3','l4'].reduce((a, k) => a + x.progress.game[k].best, 0), 0) / students.length) : 0;
  return `
  <div class="card fade-in" style="background:linear-gradient(135deg,#fff,#eff6ff);border-color:#bfdbfe">
    <h1>Halo ${esc(u.username)} ${u.role === 'admin' ? '🛠️' : '👩‍🏫'}</h1>
    <p class="muted" style="font-weight:700">${u.role === 'admin' ? 'Kelola seluruh konten & pengguna melalui CMS.' : 'Pantau progres belajar seluruh siswa di satu tempat.'}</p>
    <div class="grid grid-3 mt2">
      <div class="card center" style="box-shadow:none"><div class="big-emoji">🧒</div><h2>${students.length}</h2><div class="small muted">Siswa terdaftar</div></div>
      <div class="card center" style="box-shadow:none"><div class="big-emoji">🎯</div><h2>${avgGame}</h2><div class="small muted">Rata-rata skor game</div></div>
      <div class="card center" style="box-shadow:none"><div class="big-emoji">📝</div><h2>${evalDone}/${students.length}</h2><div class="small muted">Evaluasi selesai</div></div>
    </div>
    <div class="row mt2">
      <button class="btn btn-primary" onclick="App.go('${u.role === 'admin' ? 'cms' : 'guru'}')">${u.role === 'admin' ? '🛠️ Buka CMS' : '📊 Pantau Siswa'}</button>
      <button class="btn btn-green" onclick="App.downloadCSV()">📥 Unduh Laporan (CSV)</button>
    </div>
  </div>`;
}

/* ---------- MATERI ---------- */
VIEWS.materi = function () {
  const u = cur(); const p = u.progress;
  return `
  <div class="page-head"><h1>📚 Modul Materi</h1>
    <span class="sub">Enam petualangan belajar: dari pengertian sampai cara menjaga kesehatan. Setiap modul ditutup dengan kuis pemahaman!</span></div>
  <div class="grid grid-2">
    ${CONTENT.modules.map((m, i) => {
      const st = p.modules[m.id] || {};
      const done = !!st.done; const qdone = !!st.quizDone;
      return `<div class="card hover" onclick="App.openModule('${m.id}')" style="cursor:pointer;border-left:10px solid ${m.color}">
        <div class="row spread"><div class="row"><span style="font-size:2.3rem">${m.emoji}</span>
          <div><h3 style="margin:0">${i + 1}. ${esc(m.title)}</h3>
          <span class="small muted">Modul ${i + 1} dari 6</span></div></div>
          ${done ? '<span class="chip green">✅ Selesai</span>' : '<span class="chip">🔓 Terbuka</span>'}
        </div>
        <p class="small muted mt1">${esc(m.intro.slice(0, 130))}…</p>
        <div class="row">
          <span class="chip ${qdone ? 'green' : ''}">${qdone ? '✅ Kuis selesai' : '🧩 Kuis pemahaman'}</span>
          ${st.bestScore ? `<span class="chip orange">⭐ skor terbaik ${st.bestScore}</span>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
};
VIEWS.materiView = function () {
  const m = CONTENT.modules.find(x => x.id === S.param) || CONTENT.modules[0];
  const u = cur(); const st = u.progress.modules[m.id] || {};
  const idx = CONTENT.modules.findIndex(x => x.id === m.id);
  let secHTML = m.sections.map(s => `
    <div class="card mt1"><h3>${esc(s.h)}</h3>
      ${s.ps.map(p => `<p>${esc(p)}</p>`).join('')}
      ${s.fact ? `<div class="factbox"><span class="fact-title">🤯 TAHUKAH KAMU?</span><br>${esc(s.fact)}</div>` : ''}
    </div>`).join('');
  return `
  <div class="page-head">
    <button class="btn btn-ghost btn-sm" onclick="App.go('materi')">← Kembali</button>
    <h1>${m.emoji} ${esc(m.title)}</h1>
    <span class="sub">Modul ${idx + 1}/6</span>
  </div>
  <div class="card" style="border-left:10px solid ${m.color}">
    <p style="font-weight:700">${esc(m.intro)}</p>
    <div class="row">
      <button class="btn btn-green" onclick="App.finishModule('${m.id}')">${st.done ? '✅ Sudah dibaca' : '📖 Tandai Modul Selesai (+10 poin)'}</button>
      <button class="btn btn-primary" onclick="App.startModuleQuiz('${m.id}')">🧩 Mulai Kuis Pemahaman</button>
      <span class="chip">🤝 ${scaffoldInfo().icon} ${scaffoldInfo().name}</span>
    </div>
  </div>
  ${secHTML}
  ${m.id === 'm4' && CONTENT.enzymes ? enzymeTableHTML() : ''}
  <div class="mt2" id="quizzone">${S.quiz && S.quiz.source === 'modul' ? quizRenderHTML() : `
    <div class="card center" style="background:linear-gradient(135deg,#f0f9ff,#e0f2fe)">
      <div class="big-emoji">🧩</div>
      <h3>Sudah paham modul ini?</h3>
      <p class="small muted">Uji pemahamanmu dengan kuis singkat. Salah? Tenang, Mr. sistem akan memberi petunjuk bertahap!</p>
      <button class="btn btn-primary" onclick="App.startModuleQuiz('${m.id}')">Mulai Kuis (${m.checkpoints.length} soal)</button>
    </div>`}
  </div>
  <div class="row mt2 spread">
    ${idx > 0 ? `<button class="btn btn-ghost" onclick="App.openModule('${CONTENT.modules[idx - 1].id}')">← Modul sebelumnya</button>` : '<span></span>'}
    ${idx < CONTENT.modules.length - 1 ? `<button class="btn btn-ghost" onclick="App.openModule('${CONTENT.modules[idx + 1].id}')">Modul selanjutnya →</button>` : '<span></span>'}
  </div>`;
};

function anatomyMapHTML(activeId, mode) {
  const num = {};
  CONTENT.organs.forEach((o, i) => num[o.id] = i + 1);
  return `<div class="anatmap ${mode === 'sim' ? 'anatmap-sim' : ''}">
    <img src="${IMG_ANATOMY_MAP}" alt="Ilustrasi 3D sistem pencernaan manusia: mulut, kerongkongan, hati, kantong empedu, lambung, pankreas, usus halus, usus besar, anus" draggable="false">
    ${CONTENT.organs.map(o => {
      const p = HSPOT[o.id] || { x: 50, y: 50, side: 'right', label: o.nama };
      const act = activeId === o.id;
      return `<button class="hspot ${act ? 'active' : ''}" style="left:${p.x}%;top:${p.y}%" onclick="App.selectOrgan('${o.id}')" title="${esc(p.label)}" aria-label="${esc(p.label)}">
        <span class="hnum">${num[o.id]}</span>
        <span class="hlabel ${p.side}">${esc(p.label)}</span>
      </button>`;
    }).join('')}
  </div>`;
}

function enzymeTableHTML() {
  return `

      <tbody>${CONTENT.enzymes.map((e, i) => `
        <tr class="clickable" onclick="App.showEnzyme(${i})">
          <td><b style="color:${esc(e.warna)}">${e.emoji} ${esc(e.zat)}</b><div class="small muted">${esc(e.contoh)}</div></td>
          <td>${esc(e.organ)}</td>
          <td>${esc(e.enzim)}</td>
          <td><span class="chip green">${esc(e.hasil)}</span></td>

}
function enzymeDetailHTML(e) {

}

/* ---------- VIDEO ---------- */
function ytID(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
VIEWS.video = function () {
  return `
  <div class="page-head"><h1>🎬 Video Pembelajaran</h1>
    <span class="sub">Tonton video edukasi pilihan tentang sistem pencernaan. Daftar video ini dikelola oleh Admin melalui CMS.</span></div>
  ${!CONTENT.videos.length ? `<div class="card center"><div class="big-emoji">📺</div><h3>Belum ada video</h3><p class="small muted">Admin dapat menambahkan video YouTube lewat menu CMS → tab Video.</p></div>` : `
  <div class="grid grid-3">
    ${CONTENT.videos.map(v => {
      const id = ytID(v.url);
      return `<div class="video-card" onclick="App.playVideo('${v.id}')">
        ${id ? `<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="Thumbnail ${esc(v.title)}" style="width:100%;display:block" loading="lazy">` : `<div style="background:#e0f2fe;padding:2.4rem;text-align:center;font-size:2.4rem">▶️</div>`}
        <div style="padding:.8rem 1rem">
          <b style="font-family:'Baloo 2'">${esc(v.title)}</b>
          <div class="small muted mt1">${esc(v.desc)}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`}
  <div class="tipbox mt2">🎧 <b>Tips:</b> Tonton sampai habis, lalu coba jawab kuis di setiap modul. Butuh internet ya untuk memutar video YouTube!</div>`;
};

function mouthKB(text) {
  const t = String(text).toLowerCase();
  let best = null, bestScore = 0;
  for (const intent of MOUTH_KB) {
    let sc = 0;
    for (const k of intent.k) if (t.includes(k)) sc += k.length >= 6 ? 2 : 1;
    if (sc > bestScore) { bestScore = sc; best = intent; }
  }
  return bestScore > 0 ? pick(best.r) : pick(MOUTH_FALLBACK);
}
async function askGemini(text) {
  const key = localStorage.getItem(LS.mouth);
  if (!key) return null;
  const model = CONTENT.settings.mouthModel || 'gemini-2.0-flash';
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key);
  const sys = 'Kamu adalah Mr. Mouth, maskot asisten AI aplikasi "DIGESTIVE ADVENTURE" untuk siswa kelas 5 SD (usia 10-11 tahun) pada mata pelajaran IPAS tentang sistem pencernaan manusia. ATURAN: (1) Selalu jawab dalam Bahasa Indonesia yang sangat sederhana, hangat, dan ceria; (2) Panjang jawaban 2-6 kalimat, gunakan emoji secukupnya; (3) Gunakan analogi sehari-hari yang dekat dengan anak (misal lego, seluncuran, pabrik, pasta gigi); (4) Prioritaskan topik tubuh, makanan, dan sistem pencernaan; pertanyaan umum boleh dijawab singkat dengan bahasa anak; (5) JANGAN memberi diagnosis atau obat — jika ada keluhan kesehatan serius, sarankan bercerita ke orang tua/dokter; (6) Akhiri jawaban dengan dorongan rasa ingin tahu. (7) Panggil pengguna dengan "teman hebat".';
  try {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 15000);
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_instruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text: text }] }],
        generationConfig: { temperature: 0.8, maxOutputTokens: 500 } }), signal: ctl.signal });
    clearTimeout(tm);
    if (!res.ok) return null;
    const data = await res.json();
    const txt = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts.map(p => p.text || '').join('');
    return txt && txt.trim() ? txt.trim() : null;
  } catch (e) { return null; }
}

function serializeSections(sections) {
  return sections.map(s => ['JUDUL: ' + s.h, ...s.ps, s.fact ? 'FAKTA: ' + s.fact : ''].filter(Boolean).join('\n')).join('\n---\n');
}
function parseSections(txt) {
  return String(txt).split(/\n\s*---\s*\n/).map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    const h = (lines.shift() || '').replace(/^JUDUL:\s*/i, '');
    const ps = []; let fact = '';
    lines.forEach(l => { if (/^FAKTA:/i.test(l)) fact = l.replace(/^FAKTA:\s*/i, ''); else ps.push(l); });
    return { h, ps, fact };
  }).filter(s => s.h);
}

/* ============================================================
   APP HANDLERS (dipanggil dari onclick inline)
   ============================================================ */
const App = {
  go, logout, closeModal: () => { closeModal(); },
  /* auth */
  authTab(t) {
    $('#tab-masuk').classList.toggle('active', t === 'masuk');
    $('#tab-daftar').classList.toggle('active', t === 'daftar');
    $('#authbody').innerHTML = authFormHTML(t);
  },
  toggleGuruCode() { const sel = $('#rg-role'); if (sel) $('#gurucodewrap').classList.toggle('hidden', sel.value !== 'guru'); },
  async login() {
    const r = await doLogin($('#li-user').value, $('#li-pass').value);
    if (!r.ok) return toast(r.msg, 'red');
    startSession(r.user); toast('🎉 Selamat datang, ' + r.user.username + '! Selamat berpetualang!', 'green'); render();
  },
  async register() {
    const r = await doRegister({ email: $('#rg-email').value, username: $('#rg-user').value, password: $('#rg-pass').value, confirm: $('#rg-confirm').value, role: $('#rg-role').value, guruCode: $('#rg-gurucode') ? $('#rg-gurucode').value : '' });
    if (!r.ok) return toast(r.msg, 'red');
    startSession(r.user); toast('🎉 Akun "' + r.user.username + '" berhasil dibuat! Selamat berpetualang!', 'green'); render();
  },
  /* modul */
  openModule(id) { S.quiz = null; go('materiView', id); },
  finishModule(id) {
    const p = cur().progress.modules[id] || {};
    if (p.done) return toast('Modul ini sudah pernah kamu selesaikan ✅');
    cur().progress.modules[id] = { ...p, done: true, last: nowISO() };
    addPoints(10); checkAllBadges(); saveUsers();
    toast('📖 Modul selesai! +10 poin 🎉', 'green'); render();
  },
  startModuleQuiz(id) { startQuiz(CONTENT.modules.find(m => m.id === id).checkpoints, 'modul'); S.param = id; go('materiView', id); },
  /* anatomi */
  selectOrgan(id) { S.organSel = id; if (S.screen === 'anatomi') render(); },
  showEnzyme(i) { openModal(enzymeDetailHTML(CONTENT.enzymes[i])); },
  startOrganQuiz(id) {
    const o = CONTENT.organs.find(x => x.id === id);
    startQuiz(o.quiz, 'organ'); S.quizModal = true;
    quizModalOpen();
  },
  /* video */
  playVideo(vid) {
    const v = CONTENT.videos.find(x => x.id === vid); const id = ytID(v.url);
    openModal(`<div class="row spread mb1"><h3>${esc(v.title)}</h3><button class="btn btn-ghost btn-sm" onclick="App.closeModal()">✕ Tutup</button></div>
      <div class="vidframe">${id ? `<iframe src="https://www.youtube.com/embed/${id}" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>` : '<div class="center" style="padding:3rem">URL video tidak valid</div>'}</div>
      <p class="small muted mt1">${esc(v.desc)}</p>`);
  },
  /* simulator */
  startSim(fid) { S.sim = { food: fid, step: 0 }; render(); },
  stopSim() { S.sim = null; render(); },
  simStep(d) { const f = CONTENT.foods.find(x => x.id === S.sim.food); S.sim.step = Math.min(f.stations.length - 1, Math.max(0, S.sim.step + d)); render(); },
  finishSim() {
    const f = CONTENT.foods.find(x => x.id === S.sim.food);
    if (!cur().progress.simFoods.includes(f.id)) cur().progress.simFoods.push(f.id);
    addPoints(5); checkAllBadges(); saveUsers();
    S.sim = null; toast('🏁 Perjalanan ' + f.nama + ' selesai! +5 poin 🎉', 'green'); render();
  },
  /* game */
  startLevel(n) {
    const p = cur().progress.game;
    if (n > 1 && p['l' + n].stars === 0 && p['l' + n].best === 0 && p['l' + (n - 1)].stars === 0) {
      return toast('🔒 Selesaikan Level ' + (n - 1) + ' (minimal 1 bintang) untuk membuka level ini!', 'orange');
    }
    S.game = { level: n, phase: n === 1 ? 'order' : 'quiz' };
    if (n === 1) { S.g1 = { seq: [], pool: shuffle(CONTENT.game.l1.order), wrong: 0, scored: false, phase: 'order' }; }
    if (n === 2) { S.g2 = { idx: 0, wrong: 0, score: 0, lastWrong: false }; }
    if (n === 3) startQuiz(CONTENT.game.l3.slice(), 'game');
    if (n === 4) startQuiz(CONTENT.game.l4.slice(), 'game');
    go('gamePlay');
  },
  retryLevel(n) { S.game = null; App.startLevel(n); },
  g1Add(o) { const g1 = S.g1; if (g1.seq.length >= CONTENT.game.l1.order.length) return; g1.seq.push(o); render(); },
  g1Remove(i) { const g1 = S.g1; if (g1.scored) return; g1.seq.splice(i, 1); render(); },
  g1Check() {
    const g1 = S.g1;
    if (g1.seq.join('|') !== CONTENT.game.l1.order.join('|')) {
      g1.wrong++; recordAnswer(false); saveUsers();
      toast('😅 Urutan belum tepat — perhatikan petunjuknya ya!', 'orange');
      render();
      return;
    }
    App.g1Done();
  },
  g1Done() {
    const g1 = S.g1;
    if (!g1 || g1.scored) return;
    g1.scored = true;
    recordAnswer(true);
    const pts = Math.max(10, 30 - 5 * g1.wrong);
    g1.score = pts; addPoints(pts); touchUser();
    toast('🎉 Urutan benar! +' + pts + ' poin', 'green');
    S.game.phase = 'riddles';
    startQuiz(CONTENT.game.l1.riddles.slice(), 'game');
    S.quiz.score = pts;
    render();
  },
  g1Reset() { S.g1.seq = []; S.g1.scored = false; S.g1.pool = shuffle(CONTENT.game.l1.order); render(); },
  g2Pick(cat) {
    const g2 = S.g2; const item = CONTENT.game.l2.items[g2.idx];
    if (cat === item.k) {
      recordAnswer(true); g2.score += 10; addPoints(10); g2.lastWrong = false;
      $('#g2hint').innerHTML = '<div class="hintbox l3">✅ <b>' + (item.k === 'M' ? 'BENAR — itu pencernaan MEKANIK!' : 'BENAR — itu pencernaan KIMIAWI!') + '</b> ' + (item.k === 'M' ? 'Hanya perubahan bentuk/fisik, tanpa enzim.' : 'Ada enzim/cairan yang mengubah jenis zatnya.') + '</div>';
      $('#g2next').innerHTML = `<div class="center mt1"><button class="btn btn-primary" onclick="App.g2Next()">Lanjut →</button></div>`;
      $$('.cat-btn').forEach(b => b.disabled = true);
    } else {
      recordAnswer(false); g2.lastWrong = true; saveUsers();
      toast('😅 Belum tepat — baca petunjuknya dulu ya!', 'orange');
      render();
    }
  },
  g2Next() {
    const g2 = S.g2; g2.idx++;
    if (g2.idx >= CONTENT.game.l2.items.length) { finalizeGameLevel(2, g2.score); return; }
    render();
  },
  /* quiz machine */
  quizPick, quizNext, quizRetry,
  closeQuiz() { S.quiz = null; S.quizModal = false; closeModal(); render(); },
  /* chat */
  chatQuick(t) { const inp = $('#chin'); if (inp) { inp.value = t; App.chatSend(); } },
  chatClear() { S.chat = [{ who: 'bot', text: 'Chat dibersihkan. Hai lagi! 👋 Ada yang mau ditanyakan?' }]; render(); },
  async chatSend() {
    const inp = $('#chin'); const text = (inp.value || '').trim();
    if (!text) return;
    inp.value = '';
    S.chat.push({ who: 'user', text });

  downloadCSV,
  guruSearch(v) { S.guruSearch = v; const el = $('#gurutable'); if (el) { const q = v.toLowerCase(); el.innerHTML = guruTableHTML(USERS.filter(u => u.role === 'siswa' && (!q || u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)))); } },

    d.fitur = $('#cd-fitur').value.split('\n').map(s => s.trim()).filter(Boolean);

  devPhotoFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) return toast('File harus berupa gambar (JPG/PNG).', 'red');
    if (f.size > 8 * 1024 * 1024) return toast('Ukuran foto maksimal 8 MB.', 'red');
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 512;
        let w = img.width, h = img.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = c.toDataURL('image/jpeg', 0.85);
        $('#cd-foto').value = url;
        const pv = $('#cd-fotoprev');
        if (pv) { pv.src = url; pv.classList.remove('hidden'); }
        toast('🖼️ Foto siap — klik "Simpan Profil Pengembang" ya!', 'green');
      };
      img.onerror = () => toast('Gagal membaca gambar. Coba file lain.', 'red');
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  },
  devPhotoError(el) {
    if (el && el.parentElement) el.outerHTML = '<div class="avatar" style="width:130px;height:130px;font-size:64px;margin:auto">👩‍💻</div>';

  },
  cmsResetContent() {

  },
  cmsWipe() {
    if (!confirm('HAPUS SEMUA DATA: pengguna, progres, dan konten? Tindakan ini tidak bisa dibatalkan!')) return;
    localStorage.clear(); location.reload();
  }
};
function parsePipeQS(txt) {
  return String(txt).split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split('|').map(s => s.trim());
    if (p.length < 6) return null;
    const ai = parseInt(p[5], 10) - 1;
    return { q: p[0], opts: [p[1], p[2], p[3], p[4]], a: isNaN(ai) ? 0 : ai, hint1: p[6] || '', hint2: p[7] || '', explain: p[8] || '' };
  }).filter(Boolean);
}
function finalizeGameLevel(level, score) {
  const max = { 1: 60, 2: 80, 3: 70, 4: 40 }[level] || 0;
  const stars = starsFor(score, max);
  const rec = cur().progress.game['l' + level];
  rec.best = Math.max(rec.best, score); rec.stars = Math.max(rec.stars, stars);
  if (level === 3) awardBadge('detektif');
  if (level === 4) awardBadge('kritis');
  checkAllBadges(); saveUsers();
  S.game.result = { level, score, max, stars };
  render();
}
